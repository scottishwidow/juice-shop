name: "Security triage"
on:
  issues:
    types: [labeled]
  push:
    paths: &taskflow-paths
      - ".github/security_triage_taskflow/**"
      - ".github/workflows/security-triage.yml"
  pull_request:
    paths: *taskflow-paths
permissions:
  contents: read
env:
  TASKFLOW_AGENT_VERSION: "0.5.0"
  TASKFLOW_TOOLS_COMMIT: "b69171affdaa2700ba58f045122937651a2b0a1b"
jobs:
  lint-taskflow:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: "Use Python"
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 #v6.3.0
        with:
          python-version: "3.12"
      - name: "Install TaskFlow runner and companion tools"
        run: |
          pip install "seclab-taskflow-agent==${{ env.TASKFLOW_AGENT_VERSION }}" \
            "seclab-taskflows @ git+https://github.com/GitHubSecurityLab/seclab-taskflows.git@${{ env.TASKFLOW_TOOLS_COMMIT }}"
      - name: "Lint taskflow configuration"
        env:
          PYTHONPATH: ${{ github.workspace }}/.github
        run: |
          python3 -m seclab_taskflow_agent --lint \
            -t security_triage_taskflow.taskflows.triage \
            -m security_triage_taskflow.configs.model_config
          python3 -m seclab_taskflow_agent --lint \
            -t security_triage_taskflow.taskflows.remediate \
            -m security_triage_taskflow.configs.model_config
  read-alert:
    if: github.event.label.name == 'sec:needs-triage'
    permissions:
      contents: read
      security-events: read
    runs-on: ubuntu-latest
    outputs:
      base-commit: ${{ steps.base.outputs.commit }}
    steps:
      - name: "Check out the trusted base ref"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: "Record the base commit"
        id: base
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: "Use Node.js"
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: 24
      - name: "Install application minimalistically"
        run: npm install --ignore-scripts
      - name: "Read the alert"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: npx tsx .github/security_triage_taskflow/scripts/readAlert.ts
      - name: "Upload the alert"
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b #v4.5.0
        with:
          name: triage-alert-${{ github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: triage-alert/
  triage:
    needs: read-alert
    if: github.event.label.name == 'sec:needs-triage'
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: "Check out the base commit the alert was read against"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: ${{ needs.read-alert.outputs.base-commit }}
          persist-credentials: false
      - name: "Use Node.js"
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: 24
      - name: "Install application minimalistically"
        run: npm install --ignore-scripts
      - name: "Use Python"
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 #v6.3.0
        with:
          python-version: "3.12"
      - name: "Install TaskFlow runner and companion tools"
        run: |
          pip install "seclab-taskflow-agent==${{ env.TASKFLOW_AGENT_VERSION }}" \
            "seclab-taskflows @ git+https://github.com/GitHubSecurityLab/seclab-taskflows.git@${{ env.TASKFLOW_TOOLS_COMMIT }}"
      - name: "Download the alert"
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 #v4.1.8
        with:
          name: triage-alert-${{ github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: triage-alert/
      - name: "Run triage agent"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx .github/security_triage_taskflow/scripts/triage.ts
      - name: "Upload the verdict"
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b #v4.5.0
        with:
          name: triage-verdict-${{ github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: triage-verdict/
  post-verdict:
    needs: [read-alert, triage]
    if: always() && github.event.label.name == 'sec:needs-triage'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: "Check out current master"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: "Use Node.js"
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: 24
      - name: "Install application minimalistically"
        run: npm install --ignore-scripts
      - name: "Download the alert"
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 #v4.1.8
        with:
          name: triage-alert-${{ github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: triage-alert/
      - name: "Download the verdict"
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 #v4.1.8
        with:
          name: triage-verdict-${{ github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: triage-verdict/
      - name: "Post the verdict"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: npx tsx .github/security_triage_taskflow/scripts/postVerdict.ts
  remediate:
    if: github.event.label.name == 'sec:ready-for-remediation'
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: "Check out current master"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: "Use Node.js"
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: 24
      - name: "Install application minimalistically"
        run: npm install --ignore-scripts
      - name: "Use Python"
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 #v6.3.0
        with:
          python-version: "3.12"
      - name: "Install TaskFlow runner and companion tools"
        run: |
          pip install "seclab-taskflow-agent==${{ env.TASKFLOW_AGENT_VERSION }}" \
            "seclab-taskflows @ git+https://github.com/GitHubSecurityLab/seclab-taskflows.git@${{ env.TASKFLOW_TOOLS_COMMIT }}"
      - name: "Run remediation agent"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: npx tsx .github/security_triage_taskflow/scripts/remediate.ts
      - name: "Upload proposed change"
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b #v4.5.0
        with:
          name: remediation-${{ github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: remediation-output/
  publish:
    needs: remediate
    if: always() && github.event.label.name == 'sec:ready-for-remediation'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: "Check out current master"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: master
      - name: "Use Node.js"
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: 24
      - name: "Install application minimalistically"
        run: npm install --ignore-scripts
      - name: "Download proposed change"
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 #v4.1.8
        with:
          name: remediation-${{ github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: remediation-output/
      - name: "Publish proposed change"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: npx tsx .github/security_triage_taskflow/scripts/publish.ts
