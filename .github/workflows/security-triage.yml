name: "Security triage"
on:
  issues:
    types: [labeled]
  push:
    paths: &taskflow-paths
      - 'security_triage_taskflow/**'
      - 'lib/parseAlertUrl.ts'
      - 'lib/couplingEvidence.ts'
      - 'lib/verdictPayload.ts'
      - 'lib/taskflowVerdict.ts'
      - 'lib/scripts/securityTriage/triage.ts'
      - '.github/workflows/security-triage.yml'
  pull_request:
    paths: *taskflow-paths
permissions:
  contents: read
  issues: write
env:
  # Pinned per docs/adr/0009-taskflow-triage-implementation.md: seclab-taskflows has no tagged
  # PyPI release compatible with the agent version that has the native Anthropic backend, so it
  # is installed from a pinned commit on its main branch instead of a release tag.
  TASKFLOW_AGENT_VERSION: "0.5.0"
  TASKFLOW_TOOLS_COMMIT: "b69171affdaa2700ba58f045122937651a2b0a1b"
jobs:
  lint-taskflow:
    # Native TaskFlow configuration linting, on every push/PR that touches the taskflow files -
    # independent of the issues:labeled trigger the other jobs use, and independent of secrets:
    # --lint validates grammar and resource resolution offline, with no model call.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: "Use Python"
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 #v6.3.0
        with:
          python-version: "3.12"
      - name: "Install TaskFlow runner and companion tools"
        run: |
          pip install "seclab-taskflow-agent==${{ env.TASKFLOW_AGENT_VERSION }}" \
            "seclab-taskflows @ git+https://github.com/GitHubSecurityLab/seclab-taskflows.git@${{ env.TASKFLOW_TOOLS_COMMIT }}"
      - name: "Lint triage taskflow configuration"
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 -m seclab_taskflow_agent --lint \
            -t security_triage_taskflow.taskflows.triage \
            -m security_triage_taskflow.configs.model_config
  triage:
    # Only a human applying sec:needs-triage starts this job; no other label or event does.
    if: github.event.label.name == 'sec:needs-triage'
    # Declared per job rather than inherited, so each job's credential set is legible in one
    # place. security-events: read is the scope the code-scanning API requires: the alert's
    # rule and path are read from it, never from the issue body. issues: write covers comment
    # creation and the sec:needs-triage -> sec:triaged swap, and nothing else.
    permissions:
      contents: read
      issues: write
      security-events: read
    runs-on: ubuntu-latest
    steps:
      - name: "Check out the trusted base ref"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: "Use Node.js"
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: 24
      - name: "Install application minimalistically"
        run: npm install --ignore-scripts
      - name: "Use Python"
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 #v6.3.0
        with:
          python-version: "3.12"
      - name: "Install TaskFlow runner and companion tools"
        # Docker (for the container-shell MCP tool) is already present and running on
        # ubuntu-latest; no separate setup step is needed.
        run: |
          pip install "seclab-taskflow-agent==${{ env.TASKFLOW_AGENT_VERSION }}" \
            "seclab-taskflows @ git+https://github.com/GitHubSecurityLab/seclab-taskflows.git@${{ env.TASKFLOW_TOOLS_COMMIT }}"
      - name: "Run triage"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: npx tsx lib/scripts/securityTriage/triage.ts
  remediate:
    # Only a human applying sec:ready-for-remediation starts this job; no other label or event
    # does. This job declares no permissions of its own (issue #7, ADR-0002): it holds no
    # write credential of any kind, and its checkout does not persist one either.
    if: github.event.label.name == 'sec:ready-for-remediation'
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: "Check out the trusted base ref"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: "Use Node.js"
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: 24
      - name: "Install application minimalistically"
        run: npm install --ignore-scripts
      - name: "Run remediate"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: npx tsx lib/scripts/securityTriage/remediate.ts
      - name: "Upload proposed patch"
        # Runs even if "Run remediate" failed: a categorized refusal (or the catch-all
        # `unexpected-error`) is still written to patch-author-output/refusal.json (issue #15),
        # and the gate job below must see it to report the refusal instead of running silent.
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b #v4.5.0
        with:
          name: proposed-patch-${{ github.event.issue.number }}
          path: patch-author-output/
  gate:
    # Runs after `remediate`, in the same labelling event, so a diff is validated as soon as
    # it is proposed. This job holds the workflow's write credentials (contents: write,
    # pull-requests: write, per docs/agents/security-triage.md) and makes no model call. Its
    # checkout of the base ref is the patch author's own job, which the author cannot write
    # to, so a patch cannot influence its own validation. Issue #8 implements only the
    # refusal path; applying an authorized diff, running checks and opening a pull request
    # are issue #9.
    #
    # Runs even if `remediate` failed (`always()`): the patch author holds no credential and
    # cannot post its own refusal, so this job - the only one in the labelling event with
    # `issues: write` - must still run to report it (issue #15). The label guard is unchanged,
    # so an unrelated labelling event still runs neither job.
    needs: remediate
    if: always() && github.event.label.name == 'sec:ready-for-remediation'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      security-events: read
    runs-on: ubuntu-latest
    steps:
      - name: "Check out the trusted base ref"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: master
      - name: "Use Node.js"
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: 24
      - name: "Install application minimalistically"
        run: npm install --ignore-scripts
      - name: "Download proposed patch"
        # continue-on-error covers the rare case where `remediate` crashed before writing
        # anything at all, so no artifact exists to download. "Run gate" below still reports
        # that to the maintainer instead of running with stale or missing input.
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 #v4.1.8
        with:
          name: proposed-patch-${{ github.event.issue.number }}
          path: patch-author-output/
      - name: "Run gate"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: npx tsx lib/scripts/securityTriage/gate.ts
